[project]
name = "codesense"
version = "0.1.0"
description = "Local semantic code search engine for the CodeSense VS Code extension"
readme = "README.md"
license = "MIT"
authors = [
    { name = "RITHIK V" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",  # imported directly (vectors), so declared directly, not left transitive
    "pathspec>=1.1.1",
    # jina-embeddings-v2-base-code ships custom model code (trust_remote_code)
    # that imports helpers removed in transformers 4.50+/5.x. Pin until we
    # switch models or Jina updates their code.
    "sentence-transformers>=3.4,<6",
    "transformers>=4.44,<4.50",
    # Pre-1.0: minor versions may break the vec0 API (ADR-0003).
    "sqlite-vec>=0.1.9,<0.2",
    "torch>=2.15.0",
    # 0.26.0 corrupts node positions for files over ~6 KB (segfaults on Windows);
    # see test_large_file_has_correct_line_numbers before raising this pin.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# CPU-only PyTorch everywhere. On Linux the default PyPI wheel bundles CUDA
# (~3 GB of NVIDIA libraries) we never use: CodeSense targets laptop CPUs.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import ordering
    "B",       # flake8-bugbear: likely bugs (mutable defaults, etc.)
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # flake8-simplify
    "N",       # pep8-naming
    "C4",      # flake8-comprehensions
    "PTH",     # prefer pathlib over os.path
    "RUF",     # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "not slow" by default: the real model takes ~40 s to load; `pytest -m slow` overrides it.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
    "slow: loads the real embedding model or other heavy resources (run with -m slow)",
]

# Lets pyright/Pylance (and Claude Code's pyright-lsp plugin) find engine/.venv.
[tool.pyright]
venvPath = "."
venv = ".venv"
